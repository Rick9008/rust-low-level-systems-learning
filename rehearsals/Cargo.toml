[package]
name = "rehearsals"
# pad 實測是 Rust 1.92(2024 Edition),edition 直接跟 workspace 對齊
# (見 docs/coderpad-constraints.md)。
edition.workspace = true
version.workspace = true
publish.workspace = true

# 題 a–c 是 std 基本盤題,刻意不依賴任何 crate(連 reference 都不依賴)。
# 題 d(tokio_frame_server)用 tokio——pad 實測清單裡有它,
# idiomatic async 是另一塊要練的肌肉。
[dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
